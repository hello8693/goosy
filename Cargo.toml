[package]
name = "goosy"
version = "0.1.0"
edition = "2024"

[lib]
name = "goosy"
crate-type = ["rlib", "cdylib", "staticlib"]
[dependencies]
skia-safe = { version = "0.99", features = ["textlayout"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
unicode-segmentation = "1"
quick-xml = "0.37"
indicatif = "0.18.6"
eframe = "0.36.1"
rfd = "0.17.2"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3", default-features = false }
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLCommandBuffer", "MTLCommandQueue", "MTLDevice", "MTLDrawable", "MTLPixelFormat"] }
skia-safe = { version = "0.99", features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
skia-safe = { version = "0.99", features = ["d3d"] }

[profile.release]
opt-level = 3
lto = "thin"
