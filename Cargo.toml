[package]
name = "goosy"
version = "0.1.0"
edition = "2024"

[lib]
name = "libgoosy"
crate-type = ["rlib", "cdylib", "staticlib"]
[dependencies]
skia-safe = { version = "0.99", features = ["textlayout"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
unicode-segmentation = "1"
quick-xml = "0.37"
indicatif = "0.18.6"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "wgpu"] }
rfd = "0.17.2"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3", default-features = false }
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLCommandBuffer", "MTLCommandQueue", "MTLDevice", "MTLDrawable", "MTLPixelFormat"] }
skia-safe = { version = "0.99", features = ["metal"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
eframe = { version = "0.36.1", default-features = true }
[target.'cfg(target_os = "windows")'.dependencies]
skia-safe = { version = "0.99", features = ["d3d", "gl"] }
khronos-egl = { version = "6", default-features = false, features = ["dynamic", "1_5"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[profile.release]
opt-level = 3
lto = "thin"
